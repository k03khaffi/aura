<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Каталог — Aura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="cart.html">Корзина</a>
    <a href="account.html">Аккаунт</a>
  </nav>
</header>

<main class="catalog-page">
  <div class="container">
    <h1>Каталог</h1>

    <div class="filters">
      <select id="categoryFilter">
        <option value="">Все категории</option>
        <option value="Жакеты">Жакеты</option>
        <option value="Худи">Худи</option>
        <option value="Пальто">Пальто</option>
        <!-- добавьте остальные категории из products.json, если хотите -->
      </select>

      <input type="number" id="minPrice" placeholder="Цена от" min="0">
      <input type="number" id="maxPrice" placeholder="Цена до" min="0">

      <button onclick="applyFilters()">Применить</button>
    </div>

    <div id="product-list" class="products-grid"></div>
  </div>
</main>

<!-- Модальное окно -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()" aria-label="Закрыть">×</button>

    <div class="modal-body">
      <div class="modal-left">
        <img id="modalImage" alt="Товар">
      </div>

      <div class="modal-right">
        <h2 id="modalName"></h2>
        <p id="modalBrand" class="brand"></p>
        <p id="modalPrice" class="price"></p>

        <div class="form-group">
          <label for="modalSize">Размер</label>
          <select id="modalSize"></select>
        </div>

        <div class="form-group">
          <label for="modalColor">Цвет</label>
          <select id="modalColor"></select>
        </div>

        <div class="modal-buttons">
          <button id="modalCartBtn" class="btn-add-to-cart">В корзину</button>
          <button id="modalFavBtn" class="btn-add-to-fav">В избранное</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
