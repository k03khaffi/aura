<!DOCTYPE html>
<html>
<head>
  <title>Каталог - Aura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="cart.html">Корзина</a>
  </nav>
</header>

<div class="container">
  <h2>Каталог</h2>

  <div class="filters">
    <select id="categoryFilter">
      <option value="">Все категории</option>
      <option value="Жакеты">Жакеты</option>
      <option value="Худи">Худи</option>
      <option value="Пальто">Пальто</option>
    </select>

    <input type="number" id="minPrice" placeholder="Цена от">
    <input type="number" id="maxPrice" placeholder="Цена до">

    <button onclick="applyFilters()">Применить</button>
  </div>

  <div id="product-list" class="products-grid"></div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>

    <div class="modal-body">
      <img id="modalImage">

      <div class="modal-info">
        <h2 id="modalName"></h2>
        <p id="modalBrand"></p>
        <p class="modal-price" id="modalPrice"></p>

        <label>Размер:</label>
        <select id="modalSize"></select>

        <label>Цвет:</label>
        <select id="modalColor"></select>

        <button id="modalCartBtn">В корзину</button>
        <button id="modalFavBtn">В избранное</button>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
