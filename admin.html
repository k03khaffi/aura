<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura — Админ-панель</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Дополнительные стили только для админки (можно вынести в style.css) */
    .admin-products-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .admin-products-table th,
    .admin-products-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .admin-products-table th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .admin-products-table tr:hover {
      background: #fafafa;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.9rem;
      margin-right: 6px;
      border-radius: 6px;
    }

    .btn-edit   { background: #3498db; color: white; border: none; }
    .btn-delete { background: #e74c3c; color: white; border: none; }

    .form-add-product {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      margin-bottom: 2rem;
    }

    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .form-row input,
    .form-row select {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .form-actions {
      text-align: right;
    }
  </style>
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="#" id="logout-link">Выйти</a>
  </nav>
</header>

<main class="admin-page">
  <div class="admin-container">
    <div class="admin-header">
      <h1>Админ-панель</h1>
      <button id="logout-btn" class="btn-logout">Выйти</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="products-count">—</div>
        <div class="stat-label">Товаров в каталоге</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="users-count">—</div>
        <div class="stat-label">Пользователей</div>
      </div>
    </div>

    <!-- Форма добавления товара -->
    <section class="admin-section">
      <h2>Добавить новый товар</h2>
      <form id="add-product-form" class="form-add-product">
        <div class="form-row">
          <input type="text"    id="new-name"        placeholder="Название товара"        required>
          <input type="text"    id="new-brand"       placeholder="Бренд"                  required>
          <input type="number"  id="new-price"       placeholder="Цена (€)"              min="1" required>
        </div>
        <div class="form-row">
          <select id="new-category" required>
            <option value="" disabled selected>Категория</option>
            <option value="Жакеты">Жакеты</option>
            <option value="Худи">Худи</option>
            <option value="Пальто">Пальто</option>
            <option value="Рубашки">Рубашки</option>
            <option value="Платья">Платья</option>
            <option value="Брюки">Брюки</option>
            <option value="Юбки">Юбки</option>
            <option value="Футболки">Футболки</option>
            <option value="Свитеры">Свитеры</option>
            <option value="Джинсы">Джинсы</option>
          </select>
          <input type="url"     id="new-image"       placeholder="Ссылка на изображение[](https://...)" required>
        </div>
        <div class="form-row">
          <input type="text"    id="new-sizes"       placeholder="Размеры через запятую (S,M,L,XL)" required>
          <input type="text"    id="new-colors"      placeholder="Цвета через запятую (black,white,gray)" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Добавить товар</button>
        </div>
      </form>
    </section>

    <!-- Список товаров -->
    <section class="admin-section">
      <h2>Товары каталога</h2>
      <table class="admin-products-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Бренд</th>
            <th>Категория</th>
            <th>Цена</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="products-table-body"></tbody>
      </table>
    </section>
  </div>
</main>

<script>
// =============================================
//   Админ-панель — управление товарами
// =============================================

let products = [];

document.addEventListener("DOMContentLoaded", () => {
  const currentUser = localStorage.getItem("currentUser");
  if (!currentUser) {
    localStorage.setItem("loginRedirect", "admin.html");
    window.location.href = "auth.html";
    return;
  }

  loadProducts();
  renderStats();
  renderProductsTable();

  // Выход
  document.getElementById("logout-btn").onclick = logout;
  document.getElementById("logout-link").onclick = (e) => {
    e.preventDefault();
    logout();
  };

  // Добавление товара
  document.getElementById("add-product-form").onsubmit = function(e) {
    e.preventDefault();
    addNewProduct();
  };
});

function loadProducts() {
  // Пытаемся взять из localStorage
  const saved = localStorage.getItem("products");
  if (saved) {
    products = JSON.parse(saved);
  } else {
    // Если нет — пробуем взять из глобальной переменной (data.js) или пустой массив
    products = window.products || [];
    if (products.length > 0) {
      saveProducts();
    }
  }
}

function saveProducts() {
  localStorage.setItem("products", JSON.stringify(products));
}

function renderStats() {
  document.getElementById("products-count").textContent = products.length;
  const users = JSON.parse(localStorage.getItem("users")) || [];
  document.getElementById("users-count").textContent = users.length;
}

function renderProductsTable() {
  const tbody = document.getElementById("products-table-body");
  tbody.innerHTML = "";

  products.forEach((p, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>${p.brand}</td>
      <td>${p.category}</td>
      <td>${p.price} руб.</td>
      <td>
        <button class="btn-small btn-edit" onclick="editProduct(${index})">Редакт.</button>
        <button class="btn-small btn-delete" onclick="deleteProduct(${index})">Удалить</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function addNewProduct() {
  const name     = document.getElementById("new-name").value.trim();
  const brand    = document.getElementById("new-brand").value.trim();
  const price    = Number(document.getElementById("new-price").value);
  const category = document.getElementById("new-category").value;
  const image    = document.getElementById("new-image").value.trim();
  const sizesStr = document.getElementById("new-sizes").value.trim();
  const colorsStr= document.getElementById("new-colors").value.trim();

  if (!name || !brand || !price || !category || !image || !sizesStr || !colorsStr) {
    alert("Заполните все поля!");
    return;
  }

  const newId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;

  const newProduct = {
    id: newId,
    name,
    brand,
    category,
    price,
    image,
    sizes: sizesStr.split(",").map(s => s.trim()),
    colors: colorsStr.split(",").map(c => c.trim()),
  };

  products.push(newProduct);
  saveProducts();
  renderProductsTable();
  renderStats();

  // Очистка формы
  document.getElementById("add-product-form").reset();
  alert("Товар добавлен!");
}

function deleteProduct(index) {
  if (!confirm("Удалить товар?")) return;
  products.splice(index, 1);
  saveProducts();
  renderProductsTable();
  renderStats();
}

function editProduct(index) {
  const p = products[index];
  const newName     = prompt("Новое название:", p.name);
  const newPrice    = prompt("Новая цена:", p.price);
  const newCategory = prompt("Новая категория:", p.category);

  if (newName && newPrice && newCategory) {
    products[index].name     = newName.trim();
    products[index].price    = Number(newPrice);
    products[index].category = newCategory.trim();
    saveProducts();
    renderProductsTable();
    renderStats();
  }
}

function logout() {
  if (confirm("Выйти из аккаунта?")) {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
  }
}
</script>
</body>
</html>
