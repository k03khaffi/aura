<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura — Вход / Регистрация</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
  </nav>
</header>

<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">Вход</button>
      <button class="tab-btn" data-tab="register">Регистрация</button>
    </div>

    <!-- Форма входа -->
    <form id="login-form" class="auth-form active">
      <h2>Вход в аккаунт</h2>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="button" onclick="login()" class="btn-primary">Войти</button>
      <p class="switch-link">Нет аккаунта? <span onclick="switchTab('register')">Зарегистрируйтесь</span></p>
    </form>

    <!-- Форма регистрации -->
    <form id="register-form" class="auth-form">
      <h2>Создать аккаунт</h2>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Пароль</label>
        <input type="password" id="reg-password" placeholder="Минимум 6 символов" required>
      </div>
      <div class="form-group">
        <label for="reg-password-confirm">Повторите пароль</label>
        <input type="password" id="reg-password-confirm" placeholder="••••••••" required>
      </div>
      <button type="button" onclick="register()" class="btn-primary">Зарегистрироваться</button>
      <p class="switch-link">Уже есть аккаунт? <span onclick="switchTab('login')">Войдите</span></p>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
