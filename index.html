<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura — Новая коллекция</title>
  <link rel="stylesheet" href="css/style.css">     <!-- общие стили -->
  <link rel="stylesheet" href="css/index.css">     <!-- стили главной страницы -->
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="catalog.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="account.html">Аккаунт</a>
    <a href="admin.html">Админ</a>
  </nav>
</header>

<main>
  <section class="hero-section">
    <h2>Новая коллекция</h2>
    <div id="product-list" class="products-grid"></div>
  </section>
</main>

<!-- Модальное окно (общее для сайта, можно вынести в отдельный файл позже) -->
<div id="productModal" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close" onclick="closeModal()" aria-label="Закрыть">×</button>

    <div class="modal-body">
      <div class="modal-image-wrapper">
        <img id="modalImage" alt="" />
      </div>

      <div class="modal-info">
        <h2 id="modalName"></h2>
        <p id="modalBrand" class="brand"></p>
        <p id="modalPrice" class="price"></p>

        <div class="form-group">
          <label for="modalSize">Размер</label>
          <select id="modalSize"></select>
        </div>

        <div class="form-group">
          <label for="modalColor">Цвет</label>
          <select id="modalColor"></select>
        </div>

        <div class="modal-actions">
          <button id="modalCartBtn" class="btn-primary">В корзину</button>
          <button id="modalFavBtn" class="btn-secondary">В избранное</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
