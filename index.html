<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura — Новая коллекция</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

<header>
  <h1>Aura</h1>
  <nav>
    <a href="catalog.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    
    <!-- Эти две ссылки теперь без href — клик обрабатываем в JS -->
    <a href="#" data-protected="account">Аккаунт</a>
    <a href="#" data-protected="admin">Админ</a>
  </nav>
</header>

<main>
  <section class="hero-section">
    <h2>Новая коллекция</h2>
    <div id="product-list" class="products-grid"></div>
  </section>
</main>

<!-- Модальное окно (общее для сайта, можно вынести в отдельный файл позже) -->
<div id="productModal" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close" onclick="closeModal()" aria-label="Закрыть">×</button>

    <div class="modal-body">
      <div class="modal-image-wrapper">
        <img id="modalImage" alt="" />
      </div>

      <div class="modal-info">
        <h2 id="modalName"></h2>
        <p id="modalBrand" class="brand"></p>
        <p id="modalPrice" class="price"></p>

        <div class="form-group">
          <label for="modalSize">Размер</label>
          <select id="modalSize"></select>
        </div>

        <div class="form-group">
          <label for="modalColor">Цвет</label>
          <select id="modalColor"></select>
        </div>

        <div class="modal-actions">
          <button id="modalCartBtn" class="btn-primary">В корзину</button>
          <button id="modalFavBtn" class="btn-secondary">В избранное</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>

<script>
// Защита ссылок "Аккаунт" и "Админ"
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('a[data-protected]').forEach(link => {
    link.addEventListener("click", function(e) {
      e.preventDefault(); // предотвращаем обычный переход

      const page = this.getAttribute("data-protected");
      const isLoggedIn = !!localStorage.getItem("currentUser");

      if (isLoggedIn) {
        // Пользователь авторизован → идём на нужную страницу
        if (page === "account") {
          window.location.href = "account.html";
        } else if (page === "admin") {
          window.location.href = "admin.html";
        }
      } else {
        // Не авторизован → запоминаем, куда хотели попасть, и отправляем на вход
        localStorage.setItem("loginRedirect", page === "account" ? "account.html" : "admin.html");
        window.location.href = "auth.html";  // или "login.html" — в зависимости от вашего названия
      }
    });
  });
});
</script>

</body>
</html>
</body>
</html>
